[project]
name = "baitreel"
version = "0.1.0.dev1"
description = "Turn scambaiting call recordings into short, clearly labeled videos that teach people to spot scams."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "playwright>=1.48",
    "spacy>=3.8,<3.9",
    # The small English model spaCy uses to find people's names. Installed
    # from the official release so setup stays one command.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
baitreel = "baitreel.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/baitreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs ffmpeg and headless Chromium"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
